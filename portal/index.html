<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MiroFish Portal</title>
    <style>
      :root {
        --bg: #0f172a;
        --panel: #111827;
        --panel-2: #1f2937;
        --text: #e5e7eb;
        --muted: #94a3b8;
        --accent: #22c55e;
        --danger: #ef4444;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
        background: radial-gradient(1200px 500px at 20% -10%, #1e293b 0%, var(--bg) 55%);
        color: var(--text);
        min-height: 100vh;
      }
      .wrap {
        max-width: 860px;
        margin: 48px auto;
        padding: 0 16px;
      }
      .card {
        background: linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01));
        border: 1px solid #334155;
        border-radius: 14px;
        padding: 20px;
        margin-bottom: 16px;
      }
      h1 { margin: 0 0 8px; font-size: 30px; }
      p.sub { margin: 0 0 20px; color: var(--muted); }
      label { display: block; font-size: 14px; margin: 10px 0 6px; color: #cbd5e1; }
      input {
        width: 100%;
        padding: 12px 14px;
        border-radius: 10px;
        border: 1px solid #334155;
        background: var(--panel);
        color: var(--text);
        outline: none;
      }
      input:focus { border-color: #60a5fa; }
      .grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
      }
      .actions {
        margin-top: 16px;
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
      }
      button, a.btn {
        border: 1px solid #334155;
        background: var(--panel-2);
        color: var(--text);
        padding: 10px 14px;
        border-radius: 10px;
        cursor: pointer;
        text-decoration: none;
        font-size: 14px;
      }
      button.primary, a.btn.primary {
        border-color: #15803d;
        background: #166534;
      }
      .status {
        margin-top: 14px;
        padding: 10px 12px;
        border-radius: 10px;
        border: 1px solid #334155;
        color: #cbd5e1;
        font-size: 14px;
      }
      .ok { color: #86efac; border-color: #14532d; }
      .bad { color: #fca5a5; border-color: #7f1d1d; }
      .hint {
        color: var(--muted);
        font-size: 13px;
        margin-top: 10px;
      }
      .links { display: flex; gap: 10px; margin-top: 6px; flex-wrap: wrap; }
      @media (max-width: 640px) {
        .grid { grid-template-columns: 1fr; }
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="card">
        <h1>MiroFish Portal</h1>
        <p class="sub">Save your deployment URL and launch MiroFish from any browser.</p>
        <div class="grid">
          <div>
            <label for="frontendUrl">Frontend URL</label>
            <input id="frontendUrl" placeholder="https://your-mirofish.example.com" />
          </div>
          <div>
            <label for="apiUrl">API URL</label>
            <input id="apiUrl" placeholder="https://your-mirofish.example.com/api or :5001" />
          </div>
        </div>
        <div class="actions">
          <button id="saveBtn" class="primary">Save URLs</button>
          <a id="openBtn" class="btn primary" href="#" target="_blank" rel="noopener noreferrer">Open MiroFish</a>
          <button id="healthBtn">Check API Health</button>
          <button id="clearBtn">Clear Saved URLs</button>
        </div>
        <div id="status" class="status">No health check run yet.</div>
        <div class="hint">
          Tip: After first save, this page remembers your URLs in your browser (localStorage).
        </div>
      </div>

      <div class="card">
        <h2 style="margin-top:0;font-size:20px;">Quick links</h2>
        <div class="links">
          <a class="btn" href="https://github.com/cashemerson/Mirofish/tree/main/deploy/always-on" target="_blank" rel="noopener noreferrer">Deployment Guide</a>
          <a class="btn" href="https://github.com/666ghj/MiroFish" target="_blank" rel="noopener noreferrer">MiroFish Upstream</a>
        </div>
      </div>
    </div>

    <script>
      const frontendInput = document.getElementById("frontendUrl");
      const apiInput = document.getElementById("apiUrl");
      const statusEl = document.getElementById("status");
      const openBtn = document.getElementById("openBtn");

      const KEY = "mirofish_portal_config_v1";

      function normalize(url) {
        if (!url) return "";
        return url.replace(/\/+$/, "");
      }

      function setStatus(msg, type) {
        statusEl.textContent = msg;
        statusEl.className = "status";
        if (type === "ok") statusEl.classList.add("ok");
        if (type === "bad") statusEl.classList.add("bad");
      }

      function load() {
        const raw = localStorage.getItem(KEY);
        if (!raw) return;
        try {
          const cfg = JSON.parse(raw);
          frontendInput.value = cfg.frontendUrl || "";
          apiInput.value = cfg.apiUrl || "";
          openBtn.href = normalize(cfg.frontendUrl) || "#";
        } catch (_) {}
      }

      function save() {
        const cfg = {
          frontendUrl: normalize(frontendInput.value),
          apiUrl: normalize(apiInput.value)
        };
        localStorage.setItem(KEY, JSON.stringify(cfg));
        openBtn.href = cfg.frontendUrl || "#";
        setStatus("Saved. You can now open MiroFish directly.", "ok");
      }

      async function healthCheck() {
        const apiBase = normalize(apiInput.value);
        if (!apiBase) {
          setStatus("Set API URL first.", "bad");
          return;
        }

        const url = apiBase.includes("/api")
          ? `${apiBase}/simulation/history?limit=1`
          : `${apiBase}/api/simulation/history?limit=1`;

        setStatus("Checking API health...", "");
        try {
          const res = await fetch(url, { method: "GET" });
          if (!res.ok) {
            setStatus(`API check failed: HTTP ${res.status}`, "bad");
            return;
          }
          const data = await res.json();
          if (data && data.success) {
            setStatus("API is healthy and responding.", "ok");
          } else {
            setStatus("API responded but success flag was false.", "bad");
          }
        } catch (err) {
          setStatus(`API check error: ${err.message}`, "bad");
        }
      }

      document.getElementById("saveBtn").addEventListener("click", save);
      document.getElementById("healthBtn").addEventListener("click", healthCheck);
      document.getElementById("clearBtn").addEventListener("click", () => {
        localStorage.removeItem(KEY);
        frontendInput.value = "";
        apiInput.value = "";
        openBtn.href = "#";
        setStatus("Cleared saved URLs.", "");
      });

      load();
    </script>
  </body>
</html>
