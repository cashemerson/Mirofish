services:
  caddy:
    image: caddy:2.8-alpine
    container_name: mirofish-caddy
    depends_on:
      - portal
      - mirofish
    ports:
      - "80:80"
      - "443:443"
    env_file:
      - .env
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    command: ["caddy", "run", "--config", "/etc/caddy/Caddyfile", "--adapter", "caddyfile"]
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
